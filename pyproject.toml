[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "answerable-data"
version = "0.3.0"
description = "Deterministic validity testing for analytics and AI conclusions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jairo Gelpi Moreno" }]
keywords = [
  "analytics",
  "data-quality",
  "causal-inference",
  "evidence",
  "ai-safety",
  "data-validation",
  "llm",
  "mcp",
  "ai-agents",
  "statistical-validity",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "duckdb>=1.3,<2",
  "pyyaml>=6,<7",
  "sqlglot>=27,<30",
]

[project.urls]
Homepage = "https://github.com/Jairogelpi/answerable_data"
Documentation = "https://github.com/Jairogelpi/answerable_data#readme"
"MCP guide" = "https://github.com/Jairogelpi/answerable_data/blob/main/docs/MCP.md"
"Research paper" = "https://github.com/Jairogelpi/answerable_data/blob/main/docs/paper/paper.md"
"Benchmark protocol" = "https://github.com/Jairogelpi/answerable_data/tree/main/benchmarks/epistemic_mutations"
Source = "https://github.com/Jairogelpi/answerable_data"
Issues = "https://github.com/Jairogelpi/answerable_data/issues"
Changelog = "https://github.com/Jairogelpi/answerable_data/blob/main/CHANGELOG.md"

[project.scripts]
answerable = "answerable.cli:main"

[project.optional-dependencies]
mcp = [
  "mcp>=1.0,<3",
]
dev = [
  "build>=1.2.2",
  "mcp>=1.0,<3",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/answerable"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=answerable --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["answerable"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/render_benchmark_dashboard.py" = ["E501"]
"scripts/render_agent_comparison.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["answerable"]
mypy_path = "src"
