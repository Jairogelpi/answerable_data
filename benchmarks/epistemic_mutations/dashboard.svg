<svg xmlns="http://www.w3.org/2000/svg" width="640" height="436" viewBox="0 0 640 436" role="img" aria-label="AnswerableBench Epistemic Mutation Testing results">
  <title>AnswerableBench — Epistemic Mutation Testing</title>
  <style>:root { --bg:#ffffff; --card:#f6f8fa; --border:#d0d7de; --fg:#1f2328;
          --muted:#57606a; --accent:#1a7f37; --track:#d0d7de; }
