<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Answerable terminal demo</title>
  <desc id="desc">Animated terminal sequence showing Answerable rejecting an unsupported causal conclusion.</desc>
  <rect width="1000" height="560" rx="20" fill="#0d1117"/>
  <rect x="0" y="0" width="1000" height="54" rx="20" fill="#161b22"/>
  <circle cx="30" cy="27" r="7" fill="#ff5f56"/>
  <circle cx="54" cy="27" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="27" r="7" fill="#27c93f"/>
  <text x="500" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b949e">answerable demo</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
    <text x="40" y="100" fill="#c9d1d9">$ answerable demo</text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.18;1" dur="7s" repeatCount="indefinite"/>
      <text x="40" y="145" fill="#58a6ff">Question:</text>
      <text x="145" y="145" fill="#c9d1d9">Did campaign exposure increase 90-day retention?</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.32;1" dur="7s" repeatCount="indefinite"/>
      <text x="40" y="195" fill="#8b949e">Observed difference is measurable.</text>
      <text x="40" y="225" fill="#8b949e">Checking whether the causal conclusion is defensible...</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.49;1" dur="7s" repeatCount="indefinite"/>
      <text x="40" y="280" fill="#f85149" font-weight="700">FUNDAMENTALLY_UNIDENTIFIABLE</text>
      <text x="40" y="315" fill="#f85149">x positivity_violation</text>
      <text x="285" y="315" fill="#c9d1d9">No comparable treatment overlap.</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.66;1" dur="7s" repeatCount="indefinite"/>
      <text x="40" y="375" fill="#3fb950">SUPPORTED</text>
      <text x="180" y="375" fill="#c9d1d9">Observed retention differs between groups.</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.80;1" dur="7s" repeatCount="indefinite"/>
      <text x="40" y="425" fill="#f85149">NOT SUPPORTED</text>
      <text x="220" y="425" fill="#c9d1d9">The campaign caused the increase.</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.88;0.92;1" dur="7s" repeatCount="indefinite"/>
      <text x="40" y="490" fill="#d2a8ff">Evidence before answers.</text>
    </g>
  </g>
</svg>
