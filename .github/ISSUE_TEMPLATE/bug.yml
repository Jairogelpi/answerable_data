name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the exact verdict, state, or artifact that was incorrect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Do not attach credentials, personal data, or sensitive source rows.
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Related requirement
      placeholder: INV-004 or FR-LIFE-003
  - type: dropdown
    id: security
    attributes:
      label: Security or privacy impact
      options:
        - None known
        - Possible — no sensitive details included
    validations:
      required: true

