name: Create v0.3.0 tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    name: Tag v0.3.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag once
        env:
          TAG: v0.3.0
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists; nothing to do."
            exit 0
          fi
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "${TAG}"
