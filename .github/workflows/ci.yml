name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test with branch coverage
        run: python -m pytest

      - name: Run the documented example exactly as the README shows it
        run: |
          answerable assess \
            --data examples/campaign_retention/customers.csv \
            --question examples/campaign_retention/question.yaml \
            --output runs/campaign_retention \
          || test $? -eq 2
          answerable --json warrant verify --warrant runs/campaign_retention/warrant.json

      - name: Validate requirement traceability
        run: python scripts/check_traceability.py

      - name: Validate public schemas
        run: python scripts/validate_schemas.py

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build
      - name: Clean wheel install
        run: |
          python -m venv /tmp/answerable-wheel
          /tmp/answerable-wheel/bin/python -m pip install dist/*.whl
          /tmp/answerable-wheel/bin/python -c "import answerable; print(answerable.__version__)"
