name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test with branch coverage
        run: python -m pytest

      - name: Smoke-test real MCP server
        run: python -c "from answerable.interfaces.mcp_stdio import build_server; build_server(); print('MCP OK')"

      - name: Run the documented example exactly as the README shows it
        run: |
          answerable assess \
            --data examples/campaign_retention/customers.csv \
            --question examples/campaign_retention/question.yaml \
            --output runs/campaign_retention \
          || test $? -eq 2
          answerable --json warrant verify --warrant runs/campaign_retention/warrant.json

      - name: Run external-data regression evaluation
        run: python scripts/evaluate_external.py --output runs/external-ci

      - name: Run Epistemic Mutation Testing release gate
        if: matrix.python-version == '3.12'
        run: answerable benchmark mutations --output runs/epistemic-mutations

      - name: Validate requirement traceability
        run: python scripts/check_traceability.py

      - name: Validate public schemas
        run: python scripts/validate_schemas.py

  package:
    name: Package / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build
      - name: Clean wheel install, version agreement, CLI and MCP
        run: python scripts/check_distribution.py
